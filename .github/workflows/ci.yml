name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Needed to post test reports as PR comments (readable by everyone without
# downloading workflow artifacts).
permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  test:
    name: Unit tests + production build + deploy checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit & handler tests
        run: npm test
      - name: Production build (vite)
        run: npm run build
      - name: Netlify deployment config checks
        run: node scripts/verify-deploy.mjs

  verify-sources:
    name: Live verification of the 7 supplied URLs
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install ffprobe (validation of downloaded files)
        run: which ffprobe || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Verify every supplied source URL
        run: npm run verify:sources
      - name: Publish report to job summary
        if: always()
        run: |
          if [ -f reports/TEST_REPORT.generated.md ]; then
            cat reports/TEST_REPORT.generated.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upsert report as PR comment
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f reports/TEST_REPORT.generated.md ]; then echo "no report"; exit 0; fi
          MARKER='<!-- mediafetch-source-verification -->'
          {
            echo "$MARKER"
            echo "## Live source verification (CI run [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}))"
            echo ""
            cat reports/TEST_REPORT.generated.md
          } > /tmp/comment.md
          EXISTING=$(gh api "repos/${{ github.repository }}/issues/comments?per_page=100" --jq '[.[] | select(.body | contains("mediafetch-source-verification"))][0].id // empty')
          if [ -n "$EXISTING" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$EXISTING" -F body=@/tmp/comment.md >/dev/null
          else
            gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/comment.md >/dev/null
          fi

  e2e:
    name: Browser UI tests (desktop + mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run E2E suite against the production build
        shell: bash
        run: |
          set -o pipefail
          npx playwright test --reporter=list,github 2>&1 | tee /tmp/e2e.log
      - name: Publish E2E failure tail as PR comment
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MARKER='<!-- mediafetch-e2e-failure -->'
          {
            echo "$MARKER"
            echo "## E2E failure log (CI run [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}))"
            echo ""
            echo '```'
            tail -n 160 /tmp/e2e.log 2>/dev/null || echo "no log produced"
            echo '```'
          } > /tmp/comment.md
          EXISTING=$(gh api "repos/${{ github.repository }}/issues/comments?per_page=100" --jq '[.[] | select(.body | contains("mediafetch-e2e-failure"))][0].id // empty')
          if [ -n "$EXISTING" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$EXISTING" -F body=@/tmp/comment.md >/dev/null
          else
            gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/comment.md >/dev/null
          fi
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
